<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <script>
      (function () {
        try {
          sessionStorage.setItem('fretfactory.spa-redirect', location.pathname + location.search + location.hash);
        } catch (_) {}
        location.replace('/');
      }());
    </script>
    <p>If you are not redirected automatically, <a href="/">return to FretFactory</a>.</p>
</body>
</html>
